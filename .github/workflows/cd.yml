# Continuous deployment: after CI succeeds on a push to main, trigger the Render deploy
# hook and wait until /api/health is ok and reports the commit CI tested (`version`).
#
# Configuration (Settings → Secrets and variables → Actions):
#   secret   RENDER_DEPLOY_HOOK_URL   Render deploy hook URL (never echoed)
#   variable APP_URL                  public base URL, e.g. https://benchtrack.onrender.com
# Until the secret exists, the job is skipped with a notice instead of failing.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    # Only a successful CI run for a push to main (not a PR whose branch is named main).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check deploy configuration
        id: config
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice title=Deploy skipped::The RENDER_DEPLOY_HOOK_URL secret is not set, so nothing was deployed. Add it (and the APP_URL variable) to enable CD."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$APP_URL" ]; then
            echo "::error title=APP_URL missing::Set the APP_URL repository variable so the deploy can be verified."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: steps.config.outputs.enabled == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        # The URL is passed only via the environment and never printed; curl's error
        # messages do not include it either.
        run: |
          status=$(curl -sS -X POST -o /dev/null -w '%{http_code}' --max-time 30 "$DEPLOY_HOOK")
          echo "Deploy hook responded with HTTP $status"
          case "$status" in
            2??) ;;
            *) echo "::error::The Render deploy hook was rejected (HTTP $status)"; exit 1 ;;
          esac

      - name: Wait for the new commit to be live
        if: steps.config.outputs.enabled == 'true'
        env:
          EXPECTED_VERSION: ${{ github.event.workflow_run.head_sha }}
        # Render keeps serving the previous instance until the new build passes its health
        # check, so "status ok" alone proves nothing: wait until /api/health reports the
        # commit CI just tested. Free-tier builds are slow, hence ~10 minutes.
        run: |
          url="${APP_URL%/}/api/health"
          echo "Waiting for $url to report version $EXPECTED_VERSION"
          deadline=$((SECONDS + 600))
          attempt=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            body=$(curl -sS --max-time 10 "$url" 2>/dev/null || true)
            status=$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)
            version=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$status" = ok ] && [ "$version" = "$EXPECTED_VERSION" ]; then
              echo "Deployed version: $version (healthy after attempt $attempt, ${SECONDS}s)"
              echo "::notice title=Deployed::$version is live at ${APP_URL%/}"
              exit 0
            fi
            if [ -z "$body" ]; then
              echo "Attempt $attempt: no response yet"
            else
              echo "Attempt $attempt: status=${status:-?} version=${version:-?}"
            fi
            sleep 15
          done
          echo "::error title=Deploy not verified::$url did not report status ok with version $EXPECTED_VERSION within ~10 minutes (last: status=${status:-?} version=${version:-?})"
          exit 1
