# Local full stack: PostgreSQL + the BenchTrack image (API + SPA) built from ./Dockerfile.
#   docker compose up --build -d --wait          # app on http://localhost:${APP_PORT:-8000}
#   docker compose exec app python -m app.seed   # optional fictional demo data
#   docker compose up -d db --wait               # PostgreSQL only (dev / integration tests)
# Credentials come from .env (see .env.example); the defaults are for local use only.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-benchtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchtrack}
      POSTGRES_DB: ${POSTGRES_DB:-benchtrack}
    ports:
      # Loopback only, and 5433 to avoid clashing with a locally installed PostgreSQL.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      args:
        VITE_SHOP_NAME: ${VITE_SHOP_NAME:-BenchTrack Repair}
        # Optional: APP_VERSION=$(git rev-parse HEAD) docker compose up --build; else "dev".
        APP_VERSION: ${APP_VERSION:-}
    image: benchtrack:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # STAFF_TOKEN, LOG_LEVEL, ... from .env; the values below override it.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-benchtrack}:${POSTGRES_PASSWORD:-benchtrack}@db:5432/${POSTGRES_DB:-benchtrack}
      LOG_FORMAT: json
    ports:
      # Loopback only: reachable from this machine, not the LAN. Change APP_PORT (in .env
      # or the shell) if 8000 is busy on the host.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/benchtrack-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
