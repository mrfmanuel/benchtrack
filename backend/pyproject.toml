[project]
name = "benchtrack-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.156.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default run: unit + api. PostgreSQL tests run with `uv run pytest -m integration`
# (a later -m on the command line overrides this one).
addopts = "--strict-markers -m 'not integration'"
markers = ["integration: needs PostgreSQL via TEST_DATABASE_URL (see docs/database.md)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make the alembic package look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fictional test tokens
